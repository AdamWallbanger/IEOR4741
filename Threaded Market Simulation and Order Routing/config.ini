[feed]
# Market data updates per second (e.g., 1000, 10000, 50000)
rate_per_sec = 10000

[strategy]
# Absolute price-change trigger (e.g., 0, 2.0, 3.5)
threshold = 2.0

[run]
# Simulation length in seconds
seconds = 5

[logging]
# Placeholder for future use: {debug, info, warn, error}
verbosity = info
